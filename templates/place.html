

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Куда пойдём? 💜</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #090014, #21003d, #10001c);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 35px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(200, 130, 255, 0.3);
            border-radius: 25px;
            box-shadow: 0 0 35px rgba(160, 50, 255, 0.2);
        }

        h1 {
            color: #e0aaff;
            font-size: 30px;
        }

        p {
            color: #e8d8f5;
            line-height: 1.6;
        }

        .option {
            display: block;
            margin: 15px 0;
            padding: 18px;
            border: 1px solid #a855f7;
            border-radius: 15px;
            background: rgba(168, 85, 247, 0.12);
            cursor: pointer;
            transition: 0.2s;
            font-size: 18px;
        }

        .option:hover {
            background: rgba(168, 85, 247, 0.3);
            transform: scale(1.02);
        }

        input[type="radio"] {
            margin-right: 10px;
            accent-color: #c084fc;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(90deg, #9333ea, #c084fc);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>А теперь самое интересное 💗</h1>

        <p>
            Выбирай, куда мы отправимся на нашей встрече.
            Главное — чтобы мы были вместе ❤️
        </p>

        <form action="/thanks" method="POST">

            <label class="option">
                <input type="radio" name="place" value="KFC" required>
                🍗 KFC
            </label>

            <label class="option">
                <input type="radio" name="place" value="McDonald's">
                🍔 McDonald's
            </label>

            <label class="option">
                <input type="radio" name="place" value="Суши дома">
                🍣 Закажем суши домой
            </label>

            <button type="submit">Я выбрала! 💗</button>
        </form>
    </div>
</body>
</html>
