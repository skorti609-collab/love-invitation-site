
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Куда пойдём? 💜</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle at top, #552477, #090610 75%);
}
.card {
  width: min(100%, 600px);
  padding: 35px 25px;
  text-align: center;
  background: #191222;
  border: 1px solid #8b5caf;
  border-radius: 25px;
  box-shadow: 0 20px 70px #0009;
}
h1 { color: #d8a4ff; }
p { color: #e5d8ed; line-height: 1.7; }
.option {
  display: block;
  margin-top: 15px;
  padding: 20px;
  border: 1px solid #75439b;
  border-radius: 16px;
  background: #ffffff0c;
  cursor: pointer;
  font-size: 19px;
  transition: .2s;
}
.option:hover {
  background: #542477;
  transform: scale(1.02);
}
.option input {
  margin-right: 10px;
  accent-color: #c084fc;
}
button {
  width: 100%;
  padding: 16px;
  margin-top: 22px;
  border: 0;
  border-radius: 12px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  background: linear-gradient(90deg, #7e22ce, #c084fc);
  cursor: pointer;
}
</style>
</head>
<body>
<main class="card">
  <div style="font-size:50px">💜</div>
  <h1>А теперь самое интересное!</h1>
  <p>Ты выбрала дату — теперь давай решим, как проведём этот день.</p>
  <p>Я хочу, чтобы тебе было приятно ❤️</p>

  <form action="/thanks" method="POST">
    <label class="option">
      <input type="radio" name="place" value="KFC" required>
      🍗 KFC
    </label>

    <label class="option">
      <input type="radio" name="place" value="McDonald's">
      🍔 McDonald's
    </label>

    <label class="option">
      <input type="radio" name="place" value="Суши дома">
      🍣 Закажем суши домой
    </label>

    <button type="submit">Я выбрала! 💗</button>
  </form>
</main>
</body>
</html>
